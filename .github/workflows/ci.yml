name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --basetemp=.cache/pytest
      - name: Demo end to end
        run: quibble demo --out demo_results --cv 3x1
      - name: Swap exit codes (a deliberately weak candidate must FAIL)
        shell: bash
        run: |
          status=0
          quibble swap --incumbent histgb --candidate lightgbm --dataset breast_cancer --out demo_results || status=$?
          test "$status" -eq 0 || test "$status" -eq 2
          status=0
          quibble swap --incumbent histgb --candidate weak --dataset breast_cancer --out demo_results || status=$?
          test "$status" -eq 1
