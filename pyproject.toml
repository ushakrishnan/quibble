[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quibble-ml"  # PyPI name; the import and the command are both "quibble"
version = "0.0.1"
description = "Before you swap a tabular model, see exactly what changes: paired quality, row-level disagreement, cost and a PASS/FAIL/INCONCLUSIVE verdict"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.4", "lightgbm>=4.4",
                "catboost>=1.2.10", "psutil; sys_platform == 'win32'"]

[project.optional-dependencies]
data = ["pyarrow>=14"]
report = ["matplotlib"]
autogluon = ["autogluon.tabular"]
tabpfn = ["tabpfn"]
tabfm = ["tabfm[pytorch]>=1.0.1"]
kumo = ["structured-data-models>=0.2.1"]
# dev installs everything the test suite imports, so `pip install -e ".[dev]"` is a complete test setup
dev = ["pytest", "pyarrow>=14", "matplotlib", "markdown-it-py>=3", "bleach>=6", "openai>=2.0",
       "azure-identity>=1.19"]
web = ["openai>=2.0", "azure-identity>=1.19", "matplotlib", "markdown-it-py>=3", "bleach>=6"]
site = ["markdown-it-py>=3", "bleach>=6"]

[project.scripts]
quibble = "quibble.cli:main"

[tool.setuptools]
packages = ["quibble", "quibble.docs"]

[tool.setuptools.package-dir]
"quibble.docs" = "docs"

[tool.setuptools.package-data]
quibble = ["swap_thresholds.json", "web_assets/*.html", "web_assets/*.js", "web_assets/*.css",
           "sample_data/*/*.csv", "sample_data/*/*.json"]
"quibble.docs" = ["*.md", "blog/*.md", "assets/blog/*.svg", "assets/blog/*.png",
                 "assets/blog/*.csv", "assets/blog/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
