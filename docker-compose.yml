# UNTESTED. Usage:
#   docker compose run --rm cpu quibble_ml.run --sweep --backends histgb --datasets breast_cancer
#   docker compose run --rm gpu quibble_ml.run --sweep --backends catboost --datasets breast_cancer
# GPU needs the NVIDIA container toolkit (Docker Desktop + WSL2 GPU support on Windows).
x-base: &base
  build: .
  user: "1000:1000"
  volumes: ["./results:/app/results", "./.cache:/app/.cache"]
services:
  cpu:
    <<: *base
    environment: {QUIBBLE_DEVICE: cpu}
  gpu:
    <<: *base
    environment: {QUIBBLE_DEVICE: cuda}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
